name: Verify v175 Chat and Screen AI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: verify-v175-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Source checks and live AI verification
    outputs:
      preview_url: ${{ steps.preview.outputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run local regression checks
        run: npm run check

      # Resolve the real PR preview generated by Vercel's GitHub integration.
      # Do not hard-code a per-commit preview URL or silently test production instead.
      - name: Resolve Slickly AI Vercel preview URL
        id: preview
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/issues/${process.env.PR_NUMBER}/comments?per_page=100`, {
              headers: {
                authorization: 'Bearer ' + process.env.GH_TOKEN,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28'
              }
            });
            if (!response.ok) throw new Error('Cannot read PR deployment comments: HTTP ' + response.status);
            const comments = await response.json();
            let previewUrl = '';
            for (const comment of [...comments].reverse()) {
              if (comment.user?.login !== 'vercel[bot]' || !comment.body) continue;
              const match = comment.body.match(/=:([A-Za-z0-9+/=]+)/);
              if (!match) continue;
              let deployment;
              try { deployment = JSON.parse(Buffer.from(match[1], 'base64').toString('utf8')); }
              catch { continue; }
              const project = deployment.projects?.find(item => item.name === 'slicklyai' && item.previewUrl);
              if (project) {
                const rawUrl = String(project.previewUrl);
                let host;
                try {
                  host = new URL(rawUrl.startsWith('http') ? rawUrl : 'https://' + rawUrl).host.toLowerCase();
                } catch {
                  throw new Error('Vercel returned an invalid preview URL.');
                }
                if (!host.endsWith('.vercel.app') || host.includes('/')) {
                  throw new Error('Vercel returned an unexpected preview host.');
                }
                previewUrl = 'https://' + host;
                break;
              }
            }
            if (!previewUrl) {
              throw new Error('No Slickly AI preview URL found in Vercel PR comments. A live screen-AI test cannot be claimed.');
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'url=' + previewUrl + String.fromCharCode(10));
            console.log('Using Slickly AI PR preview: ' + previewUrl);
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Verify PR preview screen-vision API
        if: github.event_name == 'pull_request'
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERIFY_ONLY_ENDPOINT: ${{ steps.preview.outputs.url }}/api/gemini
          ALLOW_OLD_API_REVISION: 'false'
        run: npm run test:screen-vision-live

      - name: Install virtual-desktop runtime
        if: always() && (github.event_name == 'pull_request' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth libgtk-3-0 libnss3 libxss1 libasound2t64 libgbm1

      # On PRs use the preview URL discovered above; on main use the deployed production aliases.
      - name: Run real desktop UI screen-AI E2E
        if: always() && (github.event_name == 'pull_request' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLEVERLY_HOSTED_AI_TEST_OK: ${{ github.event_name == 'pull_request' && '1' || '' }}
          SLICKLY_E2E_AI_ENDPOINT: ${{ github.event_name == 'pull_request' && format('{0}/api/gemini', steps.preview.outputs.url) || '' }}
        run: xvfb-run -a npm run test:screen-ai-desktop-e2e

      - name: Verify deployed screen-vision API revision and response
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERIFY_ONLY_ENDPOINT: ${{ github.event_name == 'pull_request' && format('{0}/api/gemini', steps.preview.outputs.url) || 'https://cleverly-lime.vercel.app/api/gemini' }}
          ALLOW_OLD_API_REVISION: 'false'
        run: npm run test:screen-vision-live

      - name: Verify live Gemini fast-chat behavior
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY Actions secret is missing; live fast-chat verification cannot be claimed."
            exit 1
          fi
          npm run test:gemini-live


  production-stability-diagnostic:
    needs: verify
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    name: Diagnose chat and screen AI stability over 2.5 minutes
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Probe production chat and screen vision for 150 seconds
        env:
          SLICKLY_DIAGNOSTIC_ENDPOINT: ${{ github.event_name == 'pull_request' && format('{0}/api/gemini', needs.verify.outputs.preview_url) || 'https://cleverly-lime.vercel.app/api/gemini' }}
          SLICKLY_EXPECTED_API_REVISION: v175-fast-chat-2026-10-26-h
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SLICKLY_DIAGNOSTIC_DURATION_MS: '150000'
          SLICKLY_DIAGNOSTIC_INTERVAL_MS: '8000'
        run: node scripts/test-production-ai-stability.js

  direct-gemini-diagnostic:
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    name: Test Gemini directly from GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Probe Google Gemini directly (no Vercel proxy)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/test-direct-gemini-connectivity.js
