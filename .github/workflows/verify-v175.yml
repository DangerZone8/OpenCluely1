name: Verify v175 Chat and Screen AI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: verify-v175-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source checks (offline regression suite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run local regression checks
        run: npm run check

  production-api-revision:
    name: Production API revision (quota-free)
    needs: source-checks
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify production revision without calling Gemini
        env:
          VERIFY_ONLY_ENDPOINT: https://slicklyai.vercel.app/api/gemini
          SLICKLY_EXPECTED_API_REVISION: v175-fast-chat-2026-10-27-l
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/test-production-api-revision.js

  production-screen-vision:
    name: Production AI verification — screen vision
    needs: [source-checks, production-api-revision, production-fast-chat]
    if: always() && needs.source-checks.result == 'success' && needs.production-api-revision.result == 'success' && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify deployed API revision and real screen-vision response
        id: livevision
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERIFY_ONLY_ENDPOINT: https://slicklyai.vercel.app/api/gemini
          ALLOW_OLD_API_REVISION: 'false'
        run: npm run test:screen-vision-live
      - name: Diagnose backup endpoints if production screen vision fails
        if: always() && steps.livevision.outcome == 'failure'
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ALLOW_OLD_API_REVISION: 'true'
        run: npm run test:screen-vision-live

  production-fast-chat:
    name: Production AI verification — fast chat
    needs: [source-checks, production-api-revision]
    if: always() && needs.source-checks.result == 'success' && needs.production-api-revision.result == 'success' && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify live Gemini fast-chat behavior independently of screen vision
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OPENCLUELY_AI_ENDPOINT: https://slicklyai.vercel.app/api/gemini
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY Actions secret is missing; direct Gemini and live-chat verification cannot be claimed."
            exit 1
          fi
          npm run test:gemini-live

  direct-gemini-diagnostic:
    name: Test Gemini directly from GitHub Actions
    needs: [source-checks, desktop-screen-ai-e2e]
    if: always() && needs.source-checks.result == 'success' && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe Google Gemini directly (no Vercel proxy)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/test-direct-gemini-connectivity.js

  desktop-screen-ai-e2e:
    name: Real desktop UI E2E — Capture Screen and Live Screen AI
    needs: [source-checks, production-api-revision, production-screen-vision]
    if: always() && needs.source-checks.result == 'success' && needs.production-api-revision.result == 'success' && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install virtual-desktop runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth libgtk-3-0 libnss3 libxss1 libasound2t64 libgbm1
      - name: Exercise both actual desktop screen-AI buttons against production
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Let the desktop exercise its real HTTPS failover if the primary
          # alias transiently times out. The preceding production-screen-vision
          # job independently gates the primary endpoint itself.
          SLICKLY_E2E_SUSTAINED: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: xvfb-run -a npm run test:screen-ai-desktop-e2e

  production-stability-diagnostic:
    name: Diagnose chat and screen AI stability over 2.5 minutes
    needs: source-checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe production chat and screen vision for 150 seconds
        env:
          SLICKLY_DIAGNOSTIC_ENDPOINT: https://slicklyai.vercel.app/api/gemini
          SLICKLY_EXPECTED_API_REVISION: v175-fast-chat-2026-10-27-l
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SLICKLY_DIAGNOSTIC_DURATION_MS: '150000'
          SLICKLY_DIAGNOSTIC_INTERVAL_MS: '8000'
        run: node scripts/test-production-ai-stability.js
