name: Mobile Android and iOS

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-export:
    name: Test and bundle (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate the official Slickly brand assets
        run: node ../scripts/generate-app-icons.js

      - name: Run mobile and native integration tests
        run: npm test

      - name: Generate native project and validate platform config
        run: npx expo prebuild --platform ${{ matrix.platform }} --no-install --clean

      - name: Export ${{ matrix.platform }} JavaScript bundle
        run: npx expo export --platform ${{ matrix.platform }} --output-dir dist/${{ matrix.platform }}

  native-build:
    name: Native build (${{ matrix.platform }})
    needs: test-and-export
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate the official Slickly brand assets
        run: node ../scripts/generate-app-icons.js

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        if: matrix.platform == 'android'
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate native project
        run: npx expo prebuild --platform ${{ matrix.platform }} --no-install --clean

      - name: Verify local native module autolinking
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            npx expo-modules-autolinking resolve --platform apple > /tmp/native-modules.json
          else
            npx expo-modules-autolinking resolve --platform android > /tmp/native-modules.json
          fi
          node --input-type=module -e "import fs from 'node:fs'; const result = JSON.parse(fs.readFileSync('/tmp/native-modules.json', 'utf8')); const modules = result.modules ?? []; if (!modules.some(module => module.packageName === 'slickly-native')) { console.error('slickly-native was not discovered by Expo Autolinking'); process.exit(1); } console.log('Expo Autolinking discovered slickly-native');"

      - name: Compile Android debug APK
        if: matrix.platform == 'android'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Install iOS CocoaPods
        if: matrix.platform == 'ios'
        run: pod install --project-directory=ios

      - name: Verify iOS native module pod integration
        if: matrix.platform == 'ios'
        run: grep -q "SlicklyNative" ios/Podfile.lock

      - name: List iOS workspace schemes
        if: matrix.platform == 'ios'
        run: xcodebuild -list -workspace ios/Slickly.xcworkspace

      - name: Compile iOS simulator app and ReplayKit extension
        if: matrix.platform == 'ios'
        run: xcodebuild -workspace ios/Slickly.xcworkspace -scheme Slickly -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build

      - name: Upload Android debug APK
        if: success() && matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: slickly-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload iOS simulator app
        if: success() && matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: slickly-ios-simulator-app
          path: mobile/ios/build/Build/Products/Debug-iphonesimulator/Slickly.app
          if-no-files-found: error
