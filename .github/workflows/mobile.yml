name: Mobile Android and iOS

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Attach signed mobile installers to the latest desktop release'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-export:
    name: Test and bundle (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate the official Slickly brand assets
        run: node ../scripts/generate-app-icons.js

      - name: Run mobile and native integration tests
        run: npm test

      - name: Generate native project and validate platform config
        run: npx expo prebuild --platform ${{ matrix.platform }} --no-install --clean

      - name: Export ${{ matrix.platform }} JavaScript bundle
        run: npx expo export --platform ${{ matrix.platform }} --output-dir dist/${{ matrix.platform }}

  native-build:
    name: Native build (${{ matrix.platform }})
    needs: test-and-export
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate the official Slickly brand assets
        run: node ../scripts/generate-app-icons.js

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        if: matrix.platform == 'android'
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate native project
        run: npx expo prebuild --platform ${{ matrix.platform }} --no-install --clean

      - name: Verify local native module autolinking
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            npx expo-modules-autolinking resolve --platform apple > /tmp/native-modules.txt
          else
            npx expo-modules-autolinking resolve --platform android > /tmp/native-modules.txt
          fi
          if ! grep -q "slickly-native" /tmp/native-modules.txt; then
            echo "::error::Expo Autolinking did not report slickly-native for ${{ matrix.platform }}"
            cat /tmp/native-modules.txt
            exit 1
          fi
          echo "Expo Autolinking discovered slickly-native for ${{ matrix.platform }}"

      - name: Check whether Android release signing credentials are configured
        if: matrix.platform == 'android'
        id: android-signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          required=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed Android APK build skipped. Configure these GitHub Actions secrets: ${missing[*]}"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "All required Android signing secrets are present."
          fi

      - name: Compile Android debug APK
        if: matrix.platform == 'android'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Build and verify signed Android release APK
        if: matrix.platform == 'android' && steps.android-signing.outputs.available == 'true'
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/slickly-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          cd android
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo "Verified signed Android release APK: $APK"

      - name: Clean up temporary Android signing keystore
        if: always() && matrix.platform == 'android' && steps.android-signing.outputs.available == 'true'
        run: rm -f "$RUNNER_TEMP/slickly-upload-key.jks"

      - name: Install iOS CocoaPods
        if: matrix.platform == 'ios'
        run: pod install --project-directory=ios

      - name: Verify iOS native module pod integration
        if: matrix.platform == 'ios'
        run: grep -q "SlicklyNative" ios/Podfile.lock

      - name: List iOS workspace schemes
        if: matrix.platform == 'ios'
        run: xcodebuild -list -workspace ios/slickly.xcworkspace

      - name: Compile iOS simulator app and ReplayKit extension
        if: matrix.platform == 'ios'
        run: xcodebuild -workspace ios/slickly.xcworkspace -scheme Slickly -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build

      - name: Check whether iOS signing credentials are configured
        if: matrix.platform == 'ios'
        id: ios-signing
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          required=(IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_APP_PROVISIONING_PROFILE_BASE64 IOS_EXTENSION_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID)
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed IPA build skipped. Configure these GitHub Actions secrets: ${missing[*]}"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "All required iOS signing secrets are present."
          fi

      - name: Install Apple distribution certificate and provisioning profiles
        id: install-ios-signing
        if: matrix.platform == 'ios' && steps.ios-signing.outputs.available == 'true'
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/slickly-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import <(printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 -D) \
            -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          install_profile() {
            local encoded="$1" expected_bundle="$2" label="$3"
            local tmp="$RUNNER_TEMP/$label.mobileprovision"
            printf '%s' "$encoded" | base64 -D > "$tmp"
            local decoded="$RUNNER_TEMP/$label.plist"
            security cms -D -i "$tmp" > "$decoded"
            local uuid team app_id
            uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$decoded")
            team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$decoded")
            app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$decoded")
            if [ "$team" != "$IOS_TEAM_ID" ]; then
              echo "::error::$label provisioning profile belongs to a different Apple team."
              exit 1
            fi
            if [ "$app_id" != "$IOS_TEAM_ID.$expected_bundle" ]; then
              echo "::error::$label profile does not match $expected_bundle (application identifier: $app_id)"
              exit 1
            fi
            if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$decoded" | grep -Fq 'group.ai.slickly.mobile'; then
              echo "::error::$label profile is missing App Group group.ai.slickly.mobile"
              exit 1
            fi
            cp "$tmp" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            if [ "$label" = "slickly-app" ]; then echo "app_profile_uuid=$uuid" >> "$GITHUB_OUTPUT"; fi
            if [ "$label" = "slickly-broadcast-extension" ]; then echo "extension_profile_uuid=$uuid" >> "$GITHUB_OUTPUT"; fi
            echo "$label profile installed: $uuid"
          }
          install_profile "$IOS_APP_PROVISIONING_PROFILE_BASE64" "ai.slickly.mobile" "slickly-app"
          install_profile "$IOS_EXTENSION_PROVISIONING_PROFILE_BASE64" "ai.slickly.mobile.SlicklyScreenBroadcast" "slickly-broadcast-extension"

      - name: Archive signed iOS device app
        if: matrix.platform == 'ios' && steps.ios-signing.outputs.available == 'true'
        working-directory: mobile
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/slickly.xcworkspace \
            -scheme Slickly -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build/Slickly.xcarchive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      - name: Export and verify signed Ad Hoc IPA
        if: matrix.platform == 'ios' && steps.ios-signing.outputs.available == 'true'
        working-directory: mobile
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          APP_PROFILE_UUID: ${{ steps.install-ios-signing.outputs.app_profile_uuid }}
          EXTENSION_PROFILE_UUID: ${{ steps.install-ios-signing.outputs.extension_profile_uuid }}
        run: |
          set -euo pipefail
          cat > ios/build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>ai.slickly.mobile</key><string>$APP_PROFILE_UUID</string>
              <key>ai.slickly.mobile.SlicklyScreenBroadcast</key><string>$EXTENSION_PROFILE_UUID</string>
            </dict>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          plutil -lint ios/build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath ios/build/Slickly.xcarchive \
            -exportPath ios/build/ipa \
            -exportOptionsPlist ios/build/ExportOptions.plist
          IPA="$(find ios/build/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          mkdir -p ios/build/ipa-verify
          ditto -x -k "$IPA" ios/build/ipa-verify
          APP="ios/build/ipa-verify/Payload/Slickly.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test -f "$APP/embedded.mobileprovision"
          test -f "$APP/PlugIns/SlicklyScreenBroadcast.appex/embedded.mobileprovision"
          codesign --verify --deep --strict "$APP/PlugIns/SlicklyScreenBroadcast.appex"
          echo "Verified signed IPA: $IPA"

      - name: Upload signed iOS Ad Hoc IPA
        if: success() && matrix.platform == 'ios' && steps.ios-signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: slickly-ios-adhoc-ipa
          path: mobile/ios/build/ipa/*.ipa
          if-no-files-found: error

      - name: Clean up temporary Apple signing keychain
        if: always() && matrix.platform == 'ios' && steps.ios-signing.outputs.available == 'true'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/slickly-signing.keychain-db" || true

      - name: Upload signed Android release APK
        if: success() && matrix.platform == 'android' && steps.android-signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: slickly-android-signed-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Android debug APK
        if: success() && matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: slickly-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload iOS simulator app
        if: success() && matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: slickly-ios-simulator-app
          path: mobile/ios/build/Build/Products/Debug-iphonesimulator/Slickly.app
          if-no-files-found: error


  publish-mobile-release:
    name: Publish signed mobile installers to the latest desktop release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: native-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source for app version metadata
        uses: actions/checkout@v4

      - name: Download signed Android APK (if configured)
        uses: actions/download-artifact@v4
        with:
          name: slickly-android-signed-apk
          path: release-assets/android
          if-no-artifact-found: ignore

      - name: Download signed iOS IPA (if configured)
        uses: actions/download-artifact@v4
        with:
          name: slickly-ios-adhoc-ipa
          path: release-assets/ios
          if-no-artifact-found: ignore

      - name: Attach signed mobile installers to the current desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/publish
          APK="$(find release-assets/android -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          IPA="$(find release-assets/ios -type f -name '*.ipa' -print -quit 2>/dev/null || true)"
          if [ -z "$APK" ] && [ -z "$IPA" ]; then
            echo "::error::No signed mobile installer artifacts were produced. Configure Android and/or iOS signing secrets and rerun."
            exit 1
          fi
          TAG="$(gh release view --json tagName --jq .tagName)"
          VERSION="$(jq -r '.expo.version' mobile/app.json)"
          if [ -n "$APK" ]; then cp "$APK" "release-assets/publish/Slickly-Android-$VERSION.apk"; fi
          if [ -n "$IPA" ]; then cp "$IPA" "release-assets/publish/Slickly-iOS-$VERSION.ipa"; fi
          gh release upload "$TAG" release-assets/publish/* --clobber
          echo "Attached available signed mobile installers to existing desktop release $TAG."
