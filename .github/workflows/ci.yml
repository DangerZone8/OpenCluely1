name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: linux
          - os: windows-latest
            script: win
          - os: macos-latest
            script: mac
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Linux packaging dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xauth xvfb libasound2t64 ffmpeg python3 python3-venv python3-pip

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Verify package metadata
        run: node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if (p.version !== l.version || p.name !== l.name) process.exit(1); console.log('package metadata matches')"

      - name: Verify cross-platform clean command
        run: npm run clean

      - name: Verify Vercel static-site build
        run: node scripts/build-vercel.js

      - name: Build unpacked desktop application
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:${{ matrix.script }} -- --dir --publish never

      - name: Launch packaged Windows app smoke test
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $PWD 'dist/win-unpacked/OpenCluely.exe'
          if (-not (Test-Path $app)) {
            throw "Packaged executable not found: $app"
          }
          $userData = Join-Path $env:TEMP 'opencluely-windows-smoke'
          if (Test-Path $userData) { Remove-Item $userData -Recurse -Force }
          $proc = Start-Process -FilePath $app -ArgumentList @('--disable-gpu', "--user-data-dir=$userData", '--remote-debugging-port=9222') -PassThru
          Start-Sleep -Seconds 15
          $proc.Refresh()
          if ($proc.HasExited) {
            throw "OpenCluely exited during the 15-second Windows launch smoke test (exit code $($proc.ExitCode))."
          }
          # electron-builder can launch a bootstrap process that has no native
          # window handle; inspect all app processes instead of only that parent.
          $visibleApp = $null
          for ($attempt = 0; $attempt -lt 10 -and -not $visibleApp; $attempt++) {
            $visibleApp = Get-Process -Name 'OpenCluely' -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero -and -not [string]::IsNullOrWhiteSpace($_.MainWindowTitle) } |
              Select-Object -First 1
            if (-not $visibleApp) { Start-Sleep -Seconds 1 }
          }
          if (-not $visibleApp) {
            throw "OpenCluely stayed running but no OpenCluely process exposed a visible main window after 25 seconds."
          }
          Write-Host "PASS: packaged app exposed a visible window: $($visibleApp.MainWindowTitle)"
          node scripts/test-chat-ui-live.js
          if ($LASTEXITCODE -ne 0) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Live Electron chat UI integration test failed (exit $LASTEXITCODE)."
          }
          Stop-Process -Id $proc.Id -Force

      - name: Build Linux installer for runtime smoke test
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --linux deb --publish never

      - name: Install and launch the packaged app in a virtual desktop
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          DEB_FILE="$(find dist -maxdepth 1 -type f -name 'opencluely_*_amd64.deb' -print -quit)"
          test -n "$DEB_FILE"
          sudo apt-get install -y "./$DEB_FILE"
          PACKAGE_NAME="$(dpkg-deb -f "$DEB_FILE" Package)"
          APP_BIN="$(find /opt -type f -name opencluely -perm -111 -print -quit)"
          test -n "$APP_BIN"
          test -x "$APP_BIN"
          set +e
          xvfb-run -a timeout --signal=TERM --kill-after=5s 20s "$APP_BIN" --no-sandbox --disable-gpu --user-data-dir=/tmp/opencluely-installed-smoke
          APP_EXIT=$?
          set -e
          if [ "$APP_EXIT" -eq 124 ] || [ "$APP_EXIT" -eq 137 ] || [ "$APP_EXIT" -eq 143 ]; then
            echo "PASS: installed Electron app stayed running for the 20-second virtual-desktop smoke test."
          else
            echo "FAIL: installed Electron app exited before the smoke-test timeout (exit $APP_EXIT)."
            exit 1
          fi
