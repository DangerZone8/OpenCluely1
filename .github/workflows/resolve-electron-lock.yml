name: Resolve Electron dependency lock

on:
  push:
    branches:
      - audit/electron-security-upgrade

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: audit/electron-security-upgrade

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Regenerate dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Apply non-breaking dependency security fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm -f .github/workflows/resolve-electron-lock.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes were generated."
            exit 1
          fi
          git commit -m "Regenerate lockfile for supported Electron"
          git push origin HEAD:audit/electron-security-upgrade
