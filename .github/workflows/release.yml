name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without the leading v), e.g. 1.0.1'
        required: true
        default: '1.0.86'
      dry_run:
        description: 'Build only (skip release creation)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Test source before packaging or publishing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Validate manual release request
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $REQUESTED_VERSION (expected semantic version such as 1.0.86)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$REQUESTED_VERSION" >/dev/null 2>&1; then
            echo "Release tag v$REQUESTED_VERSION already exists; refusing to overwrite an existing release."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

      - name: Install virtual-desktop runtime for actual UI testing
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgtk-3-0 libnss3 libxss1 libasound2t64 libgbm1

      - name: Run real desktop UI screen-AI E2E
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: xvfb-run -a npm run test:screen-ai-desktop-e2e

      # These checks are release gates: main pushes also publish releases, so they must run
      # before any main-branch release. Missing credentials or an unreachable hosted endpoint must fail closed.
      - name: Run live hosted screen-vision test
        if: always()
        run: npm run test:screen-vision-live

      # Real Gemini calls are required before a tag/manual release build can proceed.
      # Configure GEMINI_API_KEY in repository Actions secrets; never print the key.
      - name: Run live Gemini chat regression tests
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run test:gemini-live

      - name: Verify package metadata
        run: node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if (p.version !== l.version || p.name !== l.name) process.exit(1); console.log('package metadata matches')"

  preflight:
    needs: [test]
    if: needs.test.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    name: Install and smoke-test packaged app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Linux runtime and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xauth xvfb libasound2t64 ffmpeg python3 python3-venv python3-pip

      - name: Install project dependencies
        run: npm ci

      - name: Build Debian installer for smoke test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --linux deb --publish never

      - name: Install and launch packaged app in virtual desktop
        shell: bash
        run: |
          set -euo pipefail
          DEB_FILE="$(find dist -maxdepth 1 -type f -name 'cleverly_*_amd64.deb' -print -quit)"
          test -n "$DEB_FILE"
          sudo apt-get install -y "./$DEB_FILE"
          PACKAGE_NAME="$(dpkg-deb -f "$DEB_FILE" Package)"
          APP_BIN="$(find /opt -type f -name cleverly -perm -111 -print -quit)"
          if [ -z "$APP_BIN" ] || [ ! -x "$APP_BIN" ]; then
            echo "Could not find installed Cleverly executable under /opt."
            dpkg -L "$PACKAGE_NAME"
            exit 1
          fi
          set +e
          xvfb-run -a timeout --signal=TERM --kill-after=5s 20s "$APP_BIN" --no-sandbox --disable-gpu --user-data-dir=/tmp/cleverly-release-smoke
          APP_EXIT=$?
          set -e
          if [ "$APP_EXIT" -eq 124 ] || [ "$APP_EXIT" -eq 137 ] || [ "$APP_EXIT" -eq 143 ]; then
            echo "PASS: packaged app stayed running for the 20-second virtual-desktop smoke test."
          else
            echo "FAIL: packaged app exited before the smoke-test timeout (exit $APP_EXIT)."
            exit 1
          fi

  build:
    needs: [test]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            script: linux
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb
          - os: windows-latest
            script: win
            artifact_glob: |
              dist/*.exe
          - os: macos-latest
            script: mac
            artifact_glob: |
              dist/*.dmg
              dist/*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # electron-builder reads `version` from package.json for artifact
      # naming (e.g. Cleverly-1.0.0-x64.dmg). When we build from a
      # git tag (v1.0.7) the package.json still says 1.0.0 by default,
      # so artifact names drift from the release tag. Sync them here.
      # `npm pkg set` is cross-platform and doesn't touch git.
      - name: Sync package.json version
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "Tag version: $VERSION"
          CURRENT=$(node -p "require('./package.json').version")
          echo "Current package.json version: $CURRENT"
          if [ "$VERSION" != "$CURRENT" ]; then
            npm pkg set "version=$VERSION"
            echo "Updated package.json to $VERSION"
          else
            echo "Version already matches tag"
          fi

      # Linux: install LinuxBuild dependencies so electron-builder can produce .deb / .AppImage
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot dpkg rpm \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            xauth xvfb libasound2t64 ffmpeg \
            python3 python3-venv python3-pip

      # Windows: enable long paths for electron-builder
      - name: Enable Windows long paths
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Build
        shell: bash
        env:
          # Intentionally do NOT set CSC_LINK / WIN_CSC_LINK etc.
          # electron-builder treats empty strings as "set but invalid"
          # and tries to resolve them as certificate paths, producing
          # "Env WIN_CSC_LINK is not correct" errors. Code signing is
          # opt-in: add the secrets to the repo and wire them in here
          # only when you have real certificates.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:${{ matrix.script }} -- --publish never

      - name: Launch packaged Windows app smoke test
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $PWD 'dist/win-unpacked/Cleverly.exe'
          if (-not (Test-Path $app)) {
            throw "Packaged executable not found: $app"
          }
          $userData = Join-Path $env:TEMP 'cleverly-release-windows-smoke'
          if (Test-Path $userData) { Remove-Item $userData -Recurse -Force }
          $proc = Start-Process -FilePath $app -ArgumentList @('--disable-gpu', "--user-data-dir=$userData") -PassThru
          Start-Sleep -Seconds 15
          $proc.Refresh()
          if ($proc.HasExited) {
            throw "Cleverly exited during the 15-second Windows release smoke test (exit code $($proc.ExitCode))."
          }
          if ($proc.MainWindowHandle -eq [IntPtr]::Zero) {
            throw "Cleverly stayed running but exposed no visible main window handle after 15 seconds."
          }
          if ([string]::IsNullOrWhiteSpace($proc.MainWindowTitle)) {
            throw "Cleverly main window has no visible title after 15 seconds."
          }
          Write-Host "PASS: packaged app stayed running and exposed a visible window: $($proc.MainWindowTitle)"
          Stop-Process -Id $proc.Id -Force

      - name: Launch packaged macOS release artifact smoke test
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "FAIL: macOS zip artifact was not produced."
            find dist -maxdepth 2 -print
            exit 1
          fi
          EXTRACT_DIR="$RUNNER_TEMP/slickly-ai-macos-release-smoke"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          ditto -x -k "$ZIP_FILE" "$EXTRACT_DIR"
          APP_PATH="$(find "$EXTRACT_DIR" -maxdepth 4 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "FAIL: macOS zip did not contain an .app bundle."
            find "$EXTRACT_DIR" -maxdepth 4 -print
            exit 1
          fi
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          APP_BIN="$APP_PATH/Contents/MacOS/$EXECUTABLE"
          if [ ! -x "$APP_BIN" ]; then
            echo "FAIL: macOS release executable missing: $APP_BIN"
            exit 1
          fi
          export APP_BIN
          export APP_USER_DATA="$RUNNER_TEMP/slickly-ai-macos-release-userdata"
          node <<'NODE'
          const { spawn } = require('node:child_process');
          const child = spawn(process.env.APP_BIN, ['--disable-gpu', '--user-data-dir=' + process.env.APP_USER_DATA], { stdio: 'inherit' });
          let survived = false;
          const hardKill = setTimeout(() => { if (child.exitCode === null) child.kill('SIGKILL'); }, 25000);
          child.once('error', error => { console.error('FAIL: could not launch extracted macOS release app:', error.message); process.exitCode = 1; });
          child.once('exit', (code, signal) => {
            clearTimeout(hardKill);
            if (survived) {
              console.log('PASS: extracted macOS release app stayed running for the 20-second smoke test.');
              return;
            }
            console.error('FAIL: extracted macOS release app exited early:', { code, signal });
            process.exitCode = 1;
          });
          setTimeout(() => {
            if (child.exitCode !== null) return;
            survived = true;
            child.kill('SIGTERM');
            console.log('20-second launch window completed; waiting for graceful shutdown.');
          }, 20000);
          NODE

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cleverly-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [test, preflight, build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate commit changelog
        id: changelog
        shell: bash
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            CURRENT_TAG="${GITHUB_REF_NAME}"
            TARGET_REF="$CURRENT_TAG"
            PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            CURRENT_TAG="v${{ inputs.version }}"
            TARGET_REF="$GITHUB_SHA"
            PREV_TAG=$(git describe --tags --abbrev=0 "$TARGET_REF" 2>/dev/null || true)
          else
            CURRENT_TAG="v1.0.${GITHUB_RUN_NUMBER}"
            TARGET_REF="$GITHUB_SHA"
            PREV_TAG=$(git describe --tags --abbrev=0 "$TARGET_REF" 2>/dev/null || true)
          fi
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git tag --sort=-creatordate | grep -vx "${CURRENT_TAG}" | while read -r t; do
              if git merge-base --is-ancestor "$t" "${CURRENT_TAG}" 2>/dev/null; then echo "$t"; break; fi
            done | head -1)
          fi

          if [ -z "$PREV_TAG" ]; then
            RANGE=""
            RANGE_LABEL="Initial release"
          else
            RANGE="${PREV_TAG}..${TARGET_REF}"
            RANGE_LABEL="[\`${PREV_TAG}...${CURRENT_TAG}\`](${REPO_URL}/compare/${PREV_TAG}...${CURRENT_TAG})"
          fi

          COMMIT_COUNT=$(git rev-list --count ${RANGE:-HEAD})
          echo "Changelog range: ${RANGE:-<all commits>} (${COMMIT_COUNT} commits)"

          FS_CHAR="$(printf '\037')"
          git log ${RANGE:-} --reverse --pretty=format:'%H%x1f%s' | awk -v FS="$FS_CHAR" -v repo="$REPO_URL" '
            {
              short=substr($1,1,7); subj=$2; low=tolower(subj); clean=subj;
              sub(/^([Ff]eat|[Ff]ix|[Dd]ocs|[Cc]hore|[Rr]efactor|[Pp]erf|[Tt]est|[Bb]uild|[Cc]i|[Ss]tyle)(\([^)]*\))?!?:[ ]*/, "", clean);
              line="- " clean " ([`" short "`](" repo "/commit/" $1 "))";
              if (low ~ /^(feat|add|introduc|new )/) f[++nf]=line;
              else if (low ~ /(^fix|bug|hotfix)/) x[++nx]=line;
              else if (low ~ /^(improv|update|refactor|perf|polish|enhance|optimi)/) m[++ni]=line;
              else if (low ~ /^(doc|readme)/) d[++nd]=line;
              else o[++no]=line;
            }
            END {
              if (nf) { print "### Features"; print ""; for(i=1;i<=nf;i++) print f[i]; print "" }
              if (nx) { print "### Fixes"; print ""; for(i=1;i<=nx;i++) print x[i]; print "" }
              if (ni) { print "### Improvements"; print ""; for(i=1;i<=ni;i++) print m[i]; print "" }
              if (nd) { print "### Documentation"; print ""; for(i=1;i<=nd;i++) print d[i]; print "" }
              if (no) { print "### Other Changes"; print ""; for(i=1;i<=no;i++) print o[i]; print "" }
            }' > CHANGELOG_SECTION.md

          {
            echo "### Summary"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "This release includes **${COMMIT_COUNT} commits** since ${PREV_TAG}."
            else
              echo "First release of Cleverly — **${COMMIT_COUNT} commits**."
            fi
            echo ""
            cat CHANGELOG_SECTION.md
          } > WHATS_CHANGED.md

          # Write combined body to file (multiline-safe)
          cat > RELEASE_BODY.md << 'BODY_EOF'
          ## Installation

          Choose the artifact for your platform:

          | Platform | File | Notes |
          |---|---|---|
          | **Windows** | `Cleverly-Setup-*.exe` | NSIS installer — installs app + adds to Start Menu |
          | **Linux** | `*.deb` | Debian/Ubuntu — auto-pulls system deps (Python, ffmpeg, GTK) |
          | **Linux** | `*.AppImage` | Universal — no install, just `chmod +x` and run |
          | **macOS** | `*.dmg` / `*.zip` | Intel and Apple Silicon builds; unsigned, so first launch may require approval in Privacy & Security |

          macOS builds are not code-signed or notarized. Gatekeeper may block first launch; users may need to approve the app in System Settings → Privacy & Security. For distribution to general users, signing and notarization are recommended.

          ## First Run

          On first launch, Cleverly opens the **Settings** window automatically for your **Google Gemini API key**.
          Get a free key from [Google AI Studio](https://aistudio.google.com/). You can also edit `.env` directly.

          ## Optional: Local Whisper (offline speech)

          Install **Python 3.10+** and **ffmpeg**, then run:
          ```bash
          ./setup.sh --no-run
          ```

          ## Checksums

          See `SHA256SUMS.txt` attached to this release.

          BODY_EOF

          {
            echo ""
            echo "## What's Changed"
            echo ""
            cat WHATS_CHANGED.md
            echo ""
            echo "**Full Changelog**: ${RANGE_LABEL}"
          } >> RELEASE_BODY.md

          echo "=== Final release body ==="
          cat RELEASE_BODY.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          # Pick only the primary installer per platform. This intentionally drops:
          #   - Windows portable EXE (we ship the NSIS installer)
          #   - .blockmap files (electron-updater diff metadata)
          #   - latest-*.yml (electron-updater channel metadata)
          #   - Source archives (GitHub auto-generates these from the tag)
          # macOS DMG and ZIP are included as installable downloads.
          #
          # The order below is the order files appear in the release page.
          find artifacts -type f -name 'Cleverly-Setup-*.exe' \
            -exec cp -v {} release/ \;
          find artifacts -type f -name 'cleverly_*_amd64.deb' \
            -exec cp -v {} release/ \;
          find artifacts -type f -name '*.AppImage' \
            -exec cp -v {} release/ \;
          find artifacts -type f -name '*.dmg' \
            -exec cp -v {} release/ \;
          find artifacts -type f -name '*.zip' \
            -exec cp -v {} release/ \;
          echo "--- Files selected for release ---"
          ls -la release/

      - name: Generate SHA256 checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.version != '' && format('v{0}', inputs.version) || format('v1.0.{0}', github.run_number)) }}
          target_commitish: ${{ github.sha }}
          name: Cleverly ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.version != '' && format('v{0}', inputs.version) || format('v1.0.{0}', github.run_number)) }}
          draft: false
          prerelease: false
          body_path: RELEASE_BODY.md
          files: |
            release/*
          fail_on_unmatched_files: false
