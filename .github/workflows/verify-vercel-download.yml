name: Verify live Vercel download

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-download:
    name: Verify live Windows installer download
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Fetch the live Windows update manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://slicklyai.vercel.app"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "$BASE/api/updates/latest.yml" -o latest.yml
          cat latest.yml
          ASSET="$(sed -n 's/^path:[[:space:]]*//p' latest.yml | head -n 1 | tr -d '\r\"')"
          SHA512="$(sed -n 's/^sha512:[[:space:]]*//p' latest.yml | head -n 1 | tr -d '\r\"')"
          EXPECTED_SIZE="$(sed -n 's/^[[:space:]]*size:[[:space:]]*//p' latest.yml | head -n 1 | tr -d '\r\"')"
          [[ "$ASSET" =~ ^Slickly-AI-Setup-[0-9.]+\.exe$ ]] || { echo "::error::Invalid Windows installer asset path: $ASSET"; exit 1; }
          [[ "$SHA512" =~ ^[A-Za-z0-9+/]+=*$ ]] || { echo "::error::Manifest SHA-512 is missing or invalid."; exit 1; }
          [[ "$EXPECTED_SIZE" =~ ^[0-9]+$ ]] || { echo "::error::Manifest file size is missing or invalid."; exit 1; }
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sha512=$SHA512" >> "$GITHUB_OUTPUT"
          echo "size=$EXPECTED_SIZE" >> "$GITHUB_OUTPUT"
      - name: Verify redirect and download the complete installer
        env:
          ASSET: ${{ steps.manifest.outputs.asset }}
          EXPECTED_SHA512: ${{ steps.manifest.outputs.sha512 }}
          EXPECTED_SIZE: ${{ steps.manifest.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://slicklyai.vercel.app/api/updates/$ASSET"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 -D response.headers -o /dev/null "$URL"
          STATUS="$(awk 'BEGIN{IGNORECASE=1} /^HTTP\//{code=$2} END{print code}' response.headers)"
          LOCATION="$(awk 'BEGIN{IGNORECASE=1} /^Location:/{sub(/\r$/, ""); sub(/^[^:]*:[[:space:]]*/, ""); print}' response.headers | tail -n 1)"
          echo "Vercel response: $STATUS"
          echo "Redirect target: $LOCATION"
          test "$STATUS" = "302" || { echo "::error::Expected Vercel to return HTTP 302 for the installer."; exit 1; }
          [[ "$LOCATION" == https://github.com/DangerZone8/OpenCluely1/releases/download/* ]] || { echo "::error::Installer did not redirect to the expected GitHub release asset."; exit 1; }
          CODE="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --output installer.exe --write-out '%{http_code}' "$URL")"
          ACTUAL_SIZE="$(wc -c < installer.exe | tr -d ' ')"
          ACTUAL_SHA512="$(openssl dgst -sha512 -binary installer.exe | base64 -w0)"
          echo "Final asset HTTP status: $CODE; downloaded bytes: $ACTUAL_SIZE"
          test "$CODE" = "200" || { echo "::error::Full installer download did not return HTTP 200."; exit 1; }
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE" || { echo "::error::Installer size mismatch: expected $EXPECTED_SIZE, got $ACTUAL_SIZE."; exit 1; }
          test "$ACTUAL_SHA512" = "$EXPECTED_SHA512" || { echo "::error::Installer SHA-512 does not match latest.yml."; exit 1; }
          echo "PASS: complete installer downloaded through Vercel; size and SHA-512 match the live manifest."
