<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Chat</title>
    <link href="./src/styles/common.css" rel="stylesheet" />
    <!-- PrismJS theme for syntax highlighting -->
    <link rel="stylesheet" href="./node_modules/prismjs/themes/prism-tomorrow.min.css" />
    <style>
      /* Font Awesome now loaded via <link> above */

      body {
        background: transparent !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      .chat-container {
        /* Keep the content area interactive; only the header is a drag handle. */
        -webkit-app-region: no-drag;
        width: 100%;
        height: 100vh;
        background: linear-gradient(
          135deg,
          rgba(0, 0, 0, 0.3) 0%,
          rgba(20, 20, 20, 0.4) 100%
        );
        backdrop-filter: blur(25px);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
      }
      .chat-header {
        padding: 16px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        -webkit-app-region: drag;
        background: rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
        cursor: move;
        user-select: none;
        -webkit-user-select: none;
        flex-shrink: 0;
      }
      .header-title {
        /* Make the title/icon area a reliable native drag surface. */
        -webkit-app-region: drag;
        color: rgba(255, 255, 255, 0.95);
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      /* Header actions (e.g., Clear History) */
      .header-actions {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .icon-button {
        -webkit-app-region: no-drag;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: rgba(255, 255, 255, 0.9);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .icon-button:hover {
        background: rgba(255, 255, 255, 0.22);
        color: #fff;
      }
      .recording-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff4757;
        animation: pulse 2s infinite;
        display: none;
        box-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
      }
      @keyframes pulse {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.1);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-app-region: no-drag;
        box-sizing: border-box;
        /* Removed max-height restriction */
      }
      .message {
        margin-bottom: 16px;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        border-left: 3px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
        word-wrap: break-word;
        word-break: break-word;
        /* Removed all height restrictions */
        position: relative;
      }
      .message.transcription {
        background: rgba(76, 175, 80, 0.15);
        animation: fadeInSlide 0.1s ease-out;
        position: relative;
      }

      .message.transcription::before {
        position: absolute;
        left: -8px;
        top: 8px;
        font-size: 12px;
        color: white;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @keyframes fadeInSlide {
        from {
          opacity: 0;
          transform: translateX(-20px);
          background: rgba(76, 175, 80, 0.3);
        }
        to {
          opacity: 1;
          transform: translateX(0);
          background: rgba(76, 175, 80, 0.15);
        }
      }
      .message.system {
        background: rgba(33, 150, 243, 0.1);
      }
      .message.error {
        background: rgba(244, 67, 54, 0.1);
      }
      .message.user {
        background: rgba(255, 152, 0, 0.1);
      }
      .message.assistant {
        background: rgba(156, 39, 176, 0.1);
        border-left: 3px solid #9c27b0;
        /* Removed all height restrictions and overflow hidden */
        display: block;
      }
      
      .message.assistant .message-text {
        /* Removed all height restrictions and overflow hidden */
        white-space: pre-wrap;
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
      }
      
      /* Ensure all content in assistant messages is fully visible */
      .message.assistant *,
      .message.assistant .bullet-point,
      .message.assistant .numbered-point,
      .message.assistant strong,
      .message.assistant em,
      .message.assistant code,
      .message.assistant pre,
      .message.assistant ul,
      .message.assistant ol,
      .message.assistant li,
      .message.assistant h1,
      .message.assistant h2,
      .message.assistant h3,
      .message.assistant h4,
      .message.assistant h5,
      .message.assistant h6,
      .message.assistant p,
      .message.assistant blockquote {
        /* Remove all height restrictions */
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
      }
      
      /* Markdown formatting for assistant messages */
      .message.assistant .bullet-point {
        margin: 4px 0;
        padding-left: 8px;
        line-height: 1.4;
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
      }
      
      .message.assistant .numbered-point {
        margin: 4px 0;
        padding-left: 16px;
        line-height: 1.4;
        position: relative;
        counter-increment: list-counter;
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
      }
      
      .message.assistant .numbered-point::before {
        content: counter(list-counter) ". ";
        position: absolute;
        left: 0;
        font-weight: 500;
        color: rgba(156, 39, 176, 0.8);
      }
      
      .message.assistant {
        counter-reset: list-counter;
      }
      
      .message.assistant strong {
        font-weight: 600;
        color: rgba(255, 255, 255, 1);
      }
      
      .message.assistant em {
        font-style: italic;
        color: rgba(255, 255, 255, 0.9);
      }
      
      .message.assistant code {
        background: rgba(0, 0, 0, 0.3);
        padding: 2px 4px;
        border-radius: 3px;
        font-family: 'Monaco', 'Menlo', monospace;
        font-size: 11px;
        color: #64ffda;
        display: inline;
      }
      
      /* Ensure code blocks are fully visible */
      .message.assistant pre {
        background: rgba(0, 0, 0, 0.4);
        padding: 8px 12px;
        border-radius: 6px;
        font-family: 'Monaco', 'Menlo', monospace;
        font-size: 11px;
        color: #64ffda;
        overflow-x: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        margin: 8px 0;
        position: relative;
      }
      
      .message.assistant pre code {
        background: transparent;
        padding: 0;
        border-radius: 0;
        display: block;
      }

      /* Copy button in code blocks */
      .copy-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        background: rgba(0, 0, 0, 0.5);
        color: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 4px 8px;
        font-size: 11px;
        border-radius: 4px;
        cursor: pointer;
        -webkit-app-region: no-drag;
        transition: background 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
      }
      .copy-btn:hover {
        background: rgba(0,0,0,0.7);
      }
      .copy-btn.copied {
        background: rgba(76, 175, 80, 0.8);
        border-color: rgba(76, 175, 80, 0.9);
        transform: scale(0.98);
      }
      
      /* Ensure lists are fully visible */
      .message.assistant ul,
      .message.assistant ol {
        margin: 8px 0;
        padding-left: 20px;
      }
      
      .message.assistant li {
        margin: 4px 0;
        line-height: 1.4;
      }
      
      /* Ensure headings are fully visible */
      .message.assistant h1,
      .message.assistant h2,
      .message.assistant h3,
      .message.assistant h4,
      .message.assistant h5,
      .message.assistant h6 {
        margin: 12px 0 8px 0;
        font-weight: 600;
        color: rgba(255, 255, 255, 1);
      }
      
      .message.assistant h1 { font-size: 16px; }
      .message.assistant h2 { font-size: 15px; }
      .message.assistant h3 { font-size: 14px; }
      .message.assistant h4,
      .message.assistant h5,
      .message.assistant h6 { font-size: 13px; }
      
      /* Ensure paragraphs are fully visible */
      .message.assistant p {
        margin: 8px 0;
      }
      
      /* Ensure blockquotes are fully visible */
      .message.assistant blockquote {
        border-left: 3px solid rgba(156, 39, 176, 0.5);
        padding-left: 12px;
        margin: 8px 0;
        font-style: italic;
        color: rgba(255, 255, 255, 0.8);
      }
      
      /* Thinking indicator animation */
      .thinking-dots {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      
      .thinking-dots .dot {
        opacity: 0.4;
        animation: thinking 1.4s infinite ease-in-out;
      }
      
      .thinking-dots .dot:nth-child(1) { animation-delay: 0s; }
      .thinking-dots .dot:nth-child(2) { animation-delay: 0.2s; }
      .thinking-dots .dot:nth-child(3) { animation-delay: 0.4s; }
      
      @keyframes thinking {
        0%, 80%, 100% {
          opacity: 0.4;
          transform: scale(1);
        }
        40% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
      
      .message.thinking {
        animation: fadeIn 0.3s ease-out;
      }
      
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .message-time {
        color: rgba(255, 255, 255, 0.6);
        font-size: 11px;
        margin-bottom: 4px;
        font-weight: 500;
      }
      .message-text {
        color: rgba(255, 255, 255, 0.95);
        font-size: 13px;
        line-height: 1.4;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        word-wrap: break-word;
        word-break: break-word;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        max-width: 100%;
        display: block;
      }
      .message-text .math {
        font-family: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', Georgia, serif;
        white-space: nowrap;
      }
      .message-text sup, .message-text sub {
        font-size: 0.72em;
        line-height: 0;
      }
      .chat-input {
        padding: 16px 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        -webkit-app-region: no-drag;
        background: rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
        flex-shrink: 0;
      }
      .input-container {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 8px 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        -webkit-app-region: no-drag;
      }
      .input-field {
        flex: 1;
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.95);
        font-size: 13px;
        outline: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        /* make it work well as multiline */
        resize: none;
        line-height: 1.4;
        min-height: 32px;
        max-height: 140px;
        overflow-y: auto;
      }
      .input-field:focus {
        outline: none;
      }
      .input-field::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }
      .send-button {
        background: rgba(255, 255, 255, 0.15);
        border: none;
        border-radius: 6px;
        padding: 6px 10px;
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        transition: all 0.2s;
        -webkit-app-region: no-drag;
      }
      .send-button:hover {
        background: rgba(255, 255, 255, 0.25);
        color: rgba(255, 255, 255, 1);
      }
      .status-message {
        text-align: center;
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        padding: 20px;
        font-style: italic;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .error-message {
        color: #ff4757;
        font-size: 12px;
        padding: 10px;
        text-align: center;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      .mic-button {
        background: rgba(255, 255, 255, 0.15);
        border: none;
        border-radius: 6px;
        padding: 6px 10px;
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        transition: all 0.2s;
        -webkit-app-region: no-drag;
      }
      .mic-button:hover {
        background: rgba(255, 255, 255, 0.25);
        color: rgba(255, 255, 255, 1);
      }
      .mic-button.recording {
        background: rgba(255, 71, 87, 0.8);
        color: white;
        box-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
      }
      .help-text {
        color: rgba(255, 255, 255, 0.7);
        font-size: 11px;
        text-align: center;
        padding: 10px;
        line-height: 1.4;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .interaction-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.8);
        color: rgba(255, 255, 255, 0.9);
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
        z-index: 1000;
      }
      .interaction-indicator.show {
        opacity: 1;
      }
      .interaction-indicator.interactive {
        background: rgba(76, 175, 80, 0.9);
      }
      .interaction-indicator.non-interactive {
        background: rgba(244, 67, 54, 0.9);
      }
      .non-interactive .input-container {
        pointer-events: none;
        opacity: 0.5;
      }
      .non-interactive .mic-button {
        pointer-events: none;
        opacity: 0.5;
      }
      .non-interactive .send-button {
        pointer-events: none;
        opacity: 0.5;
      }

      /* Minimalist Listening Animation */
      .listening-indicator {
        display: none;
        position: fixed;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(203, 203, 203, 0.3);
        border-radius: 20px;
        padding: 8px 16px;
        z-index: 1000;
        pointer-events: none;
      }

      .listening-indicator.active {
        display: flex;
        align-items: center;
        gap: 8px;
        animation: fadeInUp 0.3s ease-out;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      .listening-wave {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .wave-bar {
        width: 2px;
        background: #4caf50;
        border-radius: 1px;
        animation: waveAnimation 1.2s infinite ease-in-out;
      }

      .wave-bar:nth-child(1) {
        height: 8px;
        animation-delay: 0s;
      }
      .wave-bar:nth-child(2) {
        height: 12px;
        animation-delay: 0.15s;
      }
      .wave-bar:nth-child(3) {
        height: 16px;
        animation-delay: 0.3s;
      }
      .wave-bar:nth-child(4) {
        height: 12px;
        animation-delay: 0.45s;
      }
      .wave-bar:nth-child(5) {
        height: 8px;
        animation-delay: 0.6s;
      }

      @keyframes waveAnimation {
        0%, 100% {
          transform: scaleY(0.3);
          opacity: 0.6;
        }
        50% {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      .listening-text {
        color: rgba(255, 255, 255, 0.9);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      .listening-duration {
        color: rgba(76, 175, 80, 0.8);
        font-size: 10px;
        font-family: monospace;
        margin-left: 4px;
      }

      /* Interim text overlay */
      .interim-overlay {
        position: fixed;
        bottom: 80px;
        left: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.028);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(76, 175, 80, 0.3);
        border-radius: 8px;
        padding: 12px;
        color: rgba(255, 255, 255, 0.8);
        font-size: 12px;
        font-style: italic;
        z-index: 999;
        pointer-events: none;
        display: none;
        animation: slideUpFade 0.3s ease-out;
      }

      .interim-overlay.active {
        display: block;
      }

      @keyframes slideUpFade {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-container" id="chatContainer">
      <div class="chat-header">
        <div class="header-title">
          <i class="fas fa-microphone"></i>
          Live Transcription & Chat
          <div class="recording-indicator" id="recordingIndicator"></div>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="screenCaptureBtn" title="Capture screen and ask AI">
            <i class="fas fa-camera"></i>
          </button>
          <button class="icon-button" id="screenRecordBtn" title="Start screen recording with optional system audio">
            <i class="fas fa-circle"></i>
          </button>
          <button class="icon-button" id="systemAudioListenBtn" title="Listen to audio from a selected screen or window">
            <i class="fas fa-headphones"></i>
          </button>
          <button class="icon-button" id="overlayToggleBtn" title="Turn overlay off">
            <i class="fas fa-eye-slash"></i>
          </button>
          <button class="icon-button" id="clearHistoryBtn" title="Clear chat history">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>

      <!-- Interim Text Overlay -->
      <div class="interim-overlay" id="interimOverlay"></div>

      <div class="chat-messages" id="chatMessages"></div>

      <div class="chat-input">
        <div class="input-container">
          <textarea
            class="input-field"
            placeholder="Type a message… (Shift+Enter for newline)"
            id="messageInput"
            rows="1"
          ></textarea>
          <button class="mic-button" id="micButton" title="Start or stop microphone listening" aria-label="Start or stop microphone listening">
            <i class="fas fa-microphone"></i>
          </button>
          <button class="send-button" id="sendButton">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>
    <script src="lib/markdown.js"></script>
    <script src="lib/mathrender.js"></script>
    <!-- PrismJS core and autoloader for language components -->
    <script src="./node_modules/prismjs/prism.min.js"></script>
    <script src="./node_modules/prismjs/plugins/autoloader/prism-autoloader.min.js"></script>
    
    <script>
      // Configure Prism autoloader
      try { if (window.Prism && Prism.plugins && Prism.plugins.autoloader) { Prism.plugins.autoloader.languages_path = './node_modules/prismjs/components/'; } } catch (_) {}
    </script>
    <script>
      // Use electronAPI from preload script instead of direct require
      const whysperAPI = window.electronAPI;

      const chatMessages = document.getElementById('chatMessages');
      const recordingIndicator = document.getElementById('recordingIndicator');
      const messageInput = document.getElementById('messageInput');
      const sendButton = document.getElementById('sendButton');
      const micButton = document.getElementById('micButton');
      const chatContainer = document.getElementById('chatContainer');
      const listeningIndicator = document.getElementById('listeningIndicator');
      const listeningDuration = document.getElementById('listeningDuration');
      const interimOverlay = document.getElementById('interimOverlay');
      const clearHistoryBtn = document.getElementById('clearHistoryBtn');
      const screenCaptureBtn = document.getElementById('screenCaptureBtn');
      const screenRecordBtn = document.getElementById('screenRecordBtn');
      const systemAudioListenBtn = document.getElementById('systemAudioListenBtn');
      const overlayToggleBtn = document.getElementById('overlayToggleBtn');
      const chatHeader = document.querySelector('.chat-header');

      let isRecording = false;
      let isInteractive = true;
      let listeningStartTime = null;
      let listeningTimer = null;
      let speechAvailable = false;
      let speechCaptureMode = { rendererCaptureSupported: false };
      let rendererMicStream = null;
      let rendererMicAudioContext = null;
      let rendererMicProcessor = null;
      let customAudioRecorder = null;
      let customAudioStream = null;
      let customAudioChunks = [];
      let pendingSystemAudioStream = null;
      let isListeningToSystemAudio = false;
      let screenRecorder = null;
      let screenRecordingStream = null;
      let screenRecordingChunks = [];
      let screenRecordingBytes = 0;
      let screenRecordingAudioContext = null;
      let screenRecordingSourceStreams = [];
      const MAX_SCREEN_RECORDING_BYTES = 250 * 1024 * 1024;

      // Chat persistence and deduplication
      const CHAT_HISTORY_KEY = 'opencluely_chat_history_v1';
      let chatHistory = [];
      const recentResponseHashes = new Set();
      const RECENT_HASH_LIMIT = 50;

      function hashString(str) {
        try {
          let h = 2166136261 >>> 0; // FNV-1a
          for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          return (h >>> 0).toString(16);
        } catch (_) {
          return String(str?.length || 0);
        }
      }

      function saveHistory() {
        try {
          localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(chatHistory.slice(-500)));
        } catch (e) {
          console.warn('Failed to save history', e);
        }
      }

      function loadHistory() {
        try {
          const raw = localStorage.getItem(CHAT_HISTORY_KEY);
          if (!raw) return;
          const items = JSON.parse(raw);
          if (Array.isArray(items)) {
            chatHistory = items;
            // Render
            items.forEach(item => {
              if (item.kind === 'message') {
                addMessage(item.text, item.type, true);
              } else if (item.kind === 'snippet') {
                addCodeSnippet(item.language, item.code, true);
              }
            });
          }
        } catch (e) {
          console.warn('Failed to load history', e);
        }
      }

      function clearChatHistory(skipConfirm = false) {
        if (!skipConfirm) {
          const ok = confirm('Clear chat history?');
          if (!ok) return;
        }
        chatHistory = [];
        saveHistory();
        // Clear DOM
        if (chatMessages) chatMessages.innerHTML = '';
      }

      function applyMicVisibility() {
        // Built-in Gemini audio capture remains available without Whisper/Azure.
        if (micButton) micButton.style.display = '';
      }
      
      async function initSpeechAvailability() {
        try {
          if (window.electronAPI && window.electronAPI.getSpeechAvailability) {
            speechAvailable = await window.electronAPI.getSpeechAvailability();
            applyMicVisibility();
          }
        } catch (e) {

      async function initSpeechCaptureMode() {
        try {
          if (whysperAPI && whysperAPI.getSpeechCaptureMode) {
            speechCaptureMode = await whysperAPI.getSpeechCaptureMode();
          }
        } catch (error) {
          speechCaptureMode = { rendererCaptureSupported: false };
          console.warn('Speech capture mode unavailable:', error);
        }
      }

      // Convert the captured clip to standard 16 kHz mono PCM WAV in the renderer.
      // Gemini accepts WAV directly, so this path doesn't depend on a Whisper install
      // or on Gemini accepting the browser's WebM/Opus container.
      async function convertAudioBlobToWav(blob) {
        const decodeContext = new AudioContext();
        try {
          const decoded = await decodeContext.decodeAudioData(await blob.arrayBuffer());
          const targetRate = 16000;
          const frameCount = Math.max(1, Math.ceil(decoded.duration * targetRate));
          const pcmBytes = frameCount * 2;
          const wav = new ArrayBuffer(44 + pcmBytes);
          const view = new DataView(wav);
          const writeText = (offset, value) => {
            for (let i = 0; i < value.length; i++) view.setUint8(offset + i, value.charCodeAt(i));
          };
          writeText(0, 'RIFF');
          view.setUint32(4, 36 + pcmBytes, true);
          writeText(8, 'WAVE');
          writeText(12, 'fmt ');
          view.setUint32(16, 16, true);
          view.setUint16(20, 1, true);
          view.setUint16(22, 1, true);
          view.setUint32(24, targetRate, true);
          view.setUint32(28, targetRate * 2, true);
          view.setUint16(32, 2, true);
          view.setUint16(34, 16, true);
          writeText(36, 'data');
          view.setUint32(40, pcmBytes, true);
          const channels = Array.from({ length: decoded.numberOfChannels }, (_, i) => decoded.getChannelData(i));
          for (let i = 0; i < frameCount; i++) {
            const sourcePosition = i * decoded.sampleRate / targetRate;
            const left = Math.min(Math.floor(sourcePosition), decoded.length - 1);
            const right = Math.min(left + 1, decoded.length - 1);
            const fraction = sourcePosition - left;
            let sample = 0;
            channels.forEach(channel => {
              sample += channel[left] + (channel[right] - channel[left]) * fraction;
            });
            sample = Math.max(-1, Math.min(1, sample / channels.length));
            view.setInt16(44 + i * 2, sample < 0 ? sample * 32768 : sample * 32767, true);
          }
          return new Blob([wav], { type: 'audio/wav' });
        } finally {
          await decodeContext.close().catch(() => {});
        }
      }

      // Built-in audio path: capture locally with MediaRecorder and send the
      // resulting clip to Gemini for transcription and answering. Whisper is optional.
      async function analyzeCapturedAudioBlob(blob, sourceLabel) {
        if (!blob || !blob.size) {
          addMessage('No audio data was captured. Check the selected microphone/audio source.', 'error');
          return;
        }
        if (blob.size > 20 * 1024 * 1024) {
          addMessage('Audio clip is over 20 MB. Stop sooner and try a shorter clip.', 'error');
          return;
        }
        addMessage('Audio captured (' + sourceLabel + '). Sending it to Gemini for transcription and analysis…', 'system');
        try {
          const wavBlob = await convertAudioBlobToWav(blob);
          const bytes = new Uint8Array(await wavBlob.arrayBuffer());
          const result = await whysperAPI.analyzeCapturedAudio(bytes, 'audio/wav');
          if (result && result.response) renderAssistantResponse(result.response);
          else addMessage('Gemini returned no audio analysis.', 'error');
        } catch (error) {
          addMessage('Audio analysis failed: ' + (error.message || String(error)), 'error');
        }
      }

      let audioCaptureActive = false;
      let audioSegmentTimer = null;
      let audioSegmentRotation = false;
      let audioAnalysisQueue = Promise.resolve();
      let customAudioMimeType = 'audio/webm';

      function queueAudioAnalysis(blob, sourceLabel) {
        if (!blob || !blob.size) return;
        audioAnalysisQueue = audioAnalysisQueue
          .then(() => analyzeCapturedAudioBlob(blob, sourceLabel))
          .catch(error => addMessage('Audio analysis queue failed: ' + (error.message || String(error)), 'error'));
      }

      function scheduleAudioSegmentRotation(stream, sourceLabel) {
        if (audioSegmentTimer) clearTimeout(audioSegmentTimer);
        audioSegmentTimer = setTimeout(() => {
          audioSegmentTimer = null;
          const recorder = customAudioRecorder;
          if (!audioCaptureActive || !recorder || recorder.state === 'inactive') return;
          audioSegmentRotation = true;
          try { recorder.stop(); }
          catch (error) {
            audioSegmentRotation = false;
            addMessage('Could not rotate the live audio segment: ' + error.message, 'error');
          }
        }, 6000);
      }

      async function startBuiltInAudioCapture(stream, sourceLabel, cleanupStream = stream) {
        if (!window.MediaRecorder) throw new Error('Audio recording is not supported by this Electron build.');
        if (!stream.getAudioTracks().length) throw new Error('The selected source did not provide an audio track.');
        customAudioStream = cleanupStream;
        audioCaptureActive = true;
        audioSegmentRotation = false;
        customAudioChunks = [];
        customAudioMimeType = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus']
          .find(type => MediaRecorder.isTypeSupported(type)) || 'audio/webm';

        const beginRecorder = () => {
          const recorder = new MediaRecorder(stream, { mimeType: customAudioMimeType });
          customAudioRecorder = recorder;
          customAudioChunks = [];
          recorder.addEventListener('dataavailable', event => {
            if (event.data && event.data.size) customAudioChunks.push(event.data);
          });
          recorder.addEventListener('error', event => {
            addMessage('Audio capture failed: ' + (event.error?.message || 'unknown error'), 'error');
          });
          recorder.addEventListener('stop', () => {
            const blob = new Blob(customAudioChunks, { type: recorder.mimeType || customAudioMimeType });
            customAudioChunks = [];
            if (audioSegmentRotation) {
              audioSegmentRotation = false;
              queueAudioAnalysis(blob, sourceLabel);
              if (audioCaptureActive) {
                try {
                  beginRecorder();
                  customAudioRecorder.start(500);
                  scheduleAudioSegmentRotation(stream, sourceLabel);
                } catch (error) {
                  audioCaptureActive = false;
                  addMessage('Could not resume live audio listening: ' + error.message, 'error');
                }
              }
              return;
            }

            if (audioSegmentTimer) clearTimeout(audioSegmentTimer);
            audioSegmentTimer = null;
            queueAudioAnalysis(blob, sourceLabel);
            if (customAudioStream) customAudioStream.getTracks().forEach(track => track.stop());
            customAudioStream = null;
            customAudioRecorder = null;
            audioCaptureActive = false;
            isRecording = false;
            if (recordingIndicator) recordingIndicator.style.display = 'none';
            if (micButton) micButton.classList.remove('recording');
            if (systemAudioListenBtn) {
              systemAudioListenBtn.title = 'Listen to audio from a selected screen or window';
              systemAudioListenBtn.innerHTML = '<i class="fas fa-headphones"></i>';
              systemAudioListenBtn.classList.remove('recording');
            }
            hideListeningAnimation();
          });
          return recorder;
        };

        const recorder = beginRecorder();
        recorder.start(500);
        isRecording = true;
        if (recordingIndicator) recordingIndicator.style.display = 'block';
        if (micButton) micButton.classList.add('recording');
        if (systemAudioListenBtn) {
          systemAudioListenBtn.title = 'Stop live audio listening';
          systemAudioListenBtn.innerHTML = '<i class="fas fa-stop"></i>';
          systemAudioListenBtn.classList.add('recording');
        }
        showListeningAnimation();
        addMessage('Live listening to ' + sourceLabel + '. OpenCluely sends recent audio to Gemini about every 6 seconds while listening; click again to stop.', 'system');
        scheduleAudioSegmentRotation(stream, sourceLabel);
      }

      function stopBuiltInAudioCapture() {
        audioCaptureActive = false;
        audioSegmentRotation = false;
        if (audioSegmentTimer) clearTimeout(audioSegmentTimer);
        audioSegmentTimer = null;
        if (customAudioRecorder && customAudioRecorder.state !== 'inactive') {
          try { customAudioRecorder.stop(); }
          catch (error) { addMessage('Could not stop audio listening: ' + error.message, 'error'); }
        }
      }

      // Legacy provider-driven PCM capture remains available for the existing
      // speech-service path, but the chat's own audio controls use Gemini above.
      async function startRendererMicCapture() {
        if (!speechCaptureMode.rendererCaptureSupported || rendererMicStream) return;
        try {
          if (pendingSystemAudioStream) {
            rendererMicStream = pendingSystemAudioStream;
            pendingSystemAudioStream = null;
          } else {
            rendererMicStream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
              video: false
            });
          }
          rendererMicAudioContext = new AudioContext();
          const source = rendererMicAudioContext.createMediaStreamSource(rendererMicStream);
          rendererMicProcessor = rendererMicAudioContext.createScriptProcessor(4096, 1, 1);
          const silentOutput = rendererMicAudioContext.createGain();
          silentOutput.gain.value = 0;
          rendererMicProcessor.onaudioprocess = event => {
            if (!isRecording || !whysperAPI || !whysperAPI.sendAudioChunk) return;
            const input = event.inputBuffer.getChannelData(0);
            const ratio = rendererMicAudioContext.sampleRate / 16000;
            const outputLength = Math.floor(input.length / ratio);
            if (!outputLength) return;
            const pcm = new Int16Array(outputLength);
            for (let i = 0; i < outputLength; i++) {
              const sourcePosition = i * ratio;
              const left = Math.floor(sourcePosition);
              const fraction = sourcePosition - left;
              const a = input[Math.min(left, input.length - 1)] || 0;
              const b = input[Math.min(left + 1, input.length - 1)] || 0;
              const sample = Math.max(-1, Math.min(1, a + (b - a) * fraction));
              pcm[i] = sample < 0 ? sample * 32768 : sample * 32767;
            }
            whysperAPI.sendAudioChunk(pcm.buffer);
          };
          source.connect(rendererMicProcessor);
          rendererMicProcessor.connect(silentOutput);
          silentOutput.connect(rendererMicAudioContext.destination);
          await rendererMicAudioContext.resume();
        } catch (error) {
          stopRendererMicCapture();
          addMessage('Could not access the microphone for transcription: ' + error.message, 'error');
        }
      }

      function stopRendererMicCapture() {
        if (rendererMicProcessor) {
          rendererMicProcessor.onaudioprocess = null;
          try { rendererMicProcessor.disconnect(); } catch (_) {}
          rendererMicProcessor = null;
        }
        if (rendererMicStream) {
          rendererMicStream.getTracks().forEach(track => track.stop());
          rendererMicStream = null;
        }
        if (rendererMicAudioContext) {
          rendererMicAudioContext.close().catch(() => {});
          rendererMicAudioContext = null;
        }
      }
      
      // Listen for availability changes
      if (whysperAPI && whysperAPI.onSpeechAvailability) {
        whysperAPI.onSpeechAvailability((event, data) => {
          speechAvailable = !!(data && data.available);
          applyMicVisibility();
        });
      }
      
      // Also capture generic LLM responses (from OCR/screenshot flows)
      if (whysperAPI && whysperAPI.onLlmResponse) {
        whysperAPI.onLlmResponse((event, data) => {
          try { hideThinkingIndicator(); } catch (_) {}
          if (data && data.response) {
            renderAssistantResponse(data.response);
          }
        });
      }

      // Clear on session-cleared from main
      if (whysperAPI && whysperAPI.onSessionCleared) {
        whysperAPI.onSessionCleared(() => {
          clearChatHistory(true);
        });
      }

      // Initialize availability and history
      loadHistory();
      initSpeechAvailability();
      initSpeechCaptureMode();

      // Basic message function with markdown support for assistant messages
      function addMessage(text, type = 'user', skipPersist = false) {
        if (!chatMessages) {
          console.error('Chat messages element not found!');
          return;
        }

        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${type}`;

        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();

        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';
        
        // Format assistant messages as markdown
        if (type === 'assistant') {
          textDiv.innerHTML = formatMarkdown(text);
          if (window.renderMathInElement) window.renderMathInElement(textDiv);
        } else {
          textDiv.textContent = text;
        }

        messageDiv.appendChild(timeDiv);
        messageDiv.appendChild(textDiv);

        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        if (!skipPersist) {
          chatHistory.push({ kind: 'message', type, text });
          saveHistory();
        }
      }

      // Markdown formatter using markdown.js library
      function formatMarkdown(text) {
        if (!text) return '';
        
        try {
          if (typeof markdown !== 'undefined' && markdown.toHTML) {
            return markdown.toHTML(text);
          } else {
            console.warn('Markdown library not loaded, falling back to basic formatting');
            return text
              .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
              .replace(/\*(.+?)\*/g, '<em>$1</em>')
              .replace(/`(.+?)`/g, '<code>$1</code>')
              .replace(/\n/g, '<br>');
          }
        } catch (error) {
          console.error('Markdown parsing failed:', error);
          return text.replace(/\n/g, '<br>');
        }
      }

      // Show thinking indicator
      function showThinkingIndicator() {
        const thinkingDiv = document.createElement('div');
        thinkingDiv.className = 'message assistant thinking';
        thinkingDiv.id = 'thinking-indicator';

        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();

        const textDiv = document.createElement('div');
        textDiv.className = 'message-text thinking-dots';
        textDiv.innerHTML = '<span class="dot">•</span><span class="dot">•</span><span class="dot">•</span>';

        thinkingDiv.appendChild(timeDiv);
        thinkingDiv.appendChild(textDiv);

        chatMessages.appendChild(thinkingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      // Hide thinking indicator
      function hideThinkingIndicator() {
        const thinkingIndicator = document.getElementById('thinking-indicator');
        if (thinkingIndicator) {
          thinkingIndicator.remove();
        }
      }

      // Minimalist Listening Animation Functions
      function showListeningAnimation() {
        if (listeningIndicator) {
          listeningIndicator.classList.add('active');

          // Start timer
          listeningStartTime = Date.now();
          listeningTimer = setInterval(() => {
            if (listeningStartTime && listeningDuration) {
              const elapsed = Math.floor((Date.now() - listeningStartTime) / 1000);
              listeningDuration.textContent = `${elapsed}s`;
            }
          }, 1000);
        }
      }

      function hideListeningAnimation() {
        if (listeningIndicator) {
          listeningIndicator.classList.remove('active');
        }

        // Hide interim overlay
        if (interimOverlay) {
          interimOverlay.classList.remove('active');
        }

        // Clear timer
        if (listeningTimer) {
          clearInterval(listeningTimer);
          listeningTimer = null;
        }

        listeningStartTime = null;
      }

      function showInterimText(text) {
        if (!interimOverlay) return;

        if (text && text.trim()) {
          interimOverlay.textContent = text;
          interimOverlay.classList.add('active');
        } else {
          interimOverlay.classList.remove('active');
        }
      }

      // Recording Event Handlers
      function handleRecordingStarted() {
        isRecording = true;
        startRendererMicCapture();

        if (recordingIndicator) {
          recordingIndicator.style.display = 'block';
        }
        if (micButton) {
          micButton.classList.add('recording');
        }

        showListeningAnimation();
      }

      function handleRecordingStopped() {
        isRecording = false;
        stopRendererMicCapture();
        isListeningToSystemAudio = false;
        pendingSystemAudioStream = null;
        if (systemAudioListenBtn) {
          systemAudioListenBtn.disabled = false;
          systemAudioListenBtn.title = 'Listen to audio from a selected screen or window';
          systemAudioListenBtn.setAttribute('aria-label', systemAudioListenBtn.title);
          systemAudioListenBtn.innerHTML = '<i class="fas fa-headphones"></i>';
          systemAudioListenBtn.classList.remove('recording');
        }

        if (recordingIndicator) {
          recordingIndicator.style.display = 'none';
        }
        if (micButton) {
          micButton.classList.remove('recording');
        }

        hideListeningAnimation();
        addMessage('Stopped Listening', 'system');
      }

      function handleTranscription(text) {
        if (text && typeof text === 'string' && text.trim().length > 0) {
          // Hide listening animation first
          hideListeningAnimation();

          // Show transcribed text with slight delay for smooth transition
          setTimeout(() => {
            addMessage(text.trim(), 'transcription');
            
            // Show thinking indicator after transcription
            setTimeout(() => {
              showThinkingIndicator();
            }, 300);
          }, 200);
        } else {
          console.warn('Invalid or empty transcription text - ignoring:', text);
        }
      }

      // Helpers to capture AI response into chat (text + snippets)
      function extractCodeBlocks(text) {
        if (!text) return [];
        const blocks = [];
        const regex = /(```|~~~)([^\n]*)\n([\s\S]*?)\1/g; // supports ```lang and ~~~lang
        let match;
        while ((match = regex.exec(text)) !== null) {
          const info = (match[2] || '').trim();
          const langToken = info.split(/\s+/)[0] || 'text';
          blocks.push({ language: langToken, code: match[3], fullMatch: match[0] });
        }
        return blocks;
      }
      function stripCodeBlocks(text, blocks) {
        let result = text || '';
        blocks.forEach(b => { result = result.replace(b.fullMatch, ''); });
        return result.replace(/\n\s*\n\s*\n/g, '\n\n').trim();
      }
      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str ?? '';
        return div.innerHTML;
      }
      function attachCopy(btn, codeText) {
        if (!btn) return;
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          try {
            let ok = false;
            if (window.electronAPI && typeof window.electronAPI.copyToClipboard === 'function') {
              ok = await window.electronAPI.copyToClipboard(codeText);
            }
            if (!ok) {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(codeText);
                ok = true;
              } else {
                const ta = document.createElement('textarea');
                ta.value = codeText;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                ok = true;
              }
            }
            if (ok) {
              btn.classList.add('copied');
              const original = btn.textContent;
              btn.textContent = 'Copied';
              setTimeout(() => { btn.classList.remove('copied'); btn.textContent = original || 'Copy'; }, 1200);
            }
          } catch (err) {
            console.warn('Copy failed', err);
          }
        });
      }
      function addCodeSnippet(language, code, skipPersist = false) {
        if (!chatMessages) return;
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message assistant';
        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();
        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';

        const lang = (language || 'text').toLowerCase();
        const pre = document.createElement('pre');
        const codeEl = document.createElement('code');
        codeEl.className = `language-${lang}`;
        codeEl.innerHTML = escapeHtml(code || '');

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = 'Copy';
        attachCopy(copyBtn, code || '');

        pre.appendChild(copyBtn);
        pre.appendChild(codeEl);
        
        const label = document.createElement('div');
        label.style.cssText = 'font-size:12px;color:rgba(255,255,255,0.8);margin-bottom:6px;';
        label.textContent = `Snippet: ${lang.toUpperCase()}`;

        textDiv.appendChild(label);
        textDiv.appendChild(pre);

        messageDiv.appendChild(timeDiv);
        messageDiv.appendChild(textDiv);
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try { if (window.Prism && Prism.highlightElement) { Prism.highlightElement(codeEl); } } catch (_) {}

        if (!skipPersist) {
          chatHistory.push({ kind: 'snippet', language: lang, code: code || '' });
          saveHistory();
        }
      }
      function renderAssistantResponse(response) {
        if (!response || typeof response !== 'string') return;
        // Deduplication: avoid processing the same response twice
        const normalized = response.trim();
        const h = hashString(normalized);
        if (recentResponseHashes.has(h)) return;
        recentResponseHashes.add(h);
        if (recentResponseHashes.size > RECENT_HASH_LIMIT) {
          const first = recentResponseHashes.values().next().value;
          recentResponseHashes.delete(first);
        }

        const blocks = extractCodeBlocks(response);
        const textOnly = stripCodeBlocks(response, blocks);
        // Add text response first (if any)
        if (textOnly && textOnly.trim().length) {
          addMessage(textOnly, 'assistant');
        }
        // Add each code snippet separately
        blocks.forEach(b => addCodeSnippet(b.language, b.code));
      }

      // Basic IPC Event Listeners - simplified
      
      // Listen for transcription events
      if (whysperAPI) {
        whysperAPI.onTranscriptionReceived((event, data) => {
          if (data && data.text) {
            handleTranscription(data.text);
          } else {
            console.warn('Invalid transcription data received:', data);
          }
        });

        whysperAPI.onInterimTranscription((event, data) => {
          if (data && data.text) {
            showInterimText(data.text);
          }
        });

        // Listen for speech status
        whysperAPI.onSpeechStatus((event, data) => {
          if (data && data.status) {
            addMessage(data.status, 'system');

            if (data.status.includes('started') || data.status.includes('Recording')) {
              handleRecordingStarted();
            } else if (data.status.includes('stopped') || data.status.includes('ended')) {
              handleRecordingStopped();
            }
          }
        });

        // Listen for speech errors
        whysperAPI.onSpeechError((event, data) => {
          if (data && data.error) {
            addMessage(`Error in recognizing speech`, 'error');
            handleRecordingStopped();
          }
        });

        // Listen for other events
        whysperAPI.onRecordingStarted(() => {
          handleRecordingStarted();
        });

        whysperAPI.onRecordingStopped(() => {
          handleRecordingStopped();
        });

        whysperAPI.onSessionCleared(() => {
          addMessage('Session memory has been cleared', 'system');
        });

        // Replace transcription LLM handler to store text + snippets
        whysperAPI.onTranscriptionLlmResponse((event, data) => {
          if (data && data.response) {
            try { hideThinkingIndicator(); } catch (_) {}
            renderAssistantResponse(data.response);
          }
        });
      }

      // UI Event Listeners
      if (clearHistoryBtn) {
        clearHistoryBtn.addEventListener('click', () => clearChatHistory());
      }

      // Reuse the existing, permission-aware screenshot/OCR pipeline.
      if (screenCaptureBtn) {
        screenCaptureBtn.addEventListener('click', async () => {
          screenCaptureBtn.disabled = true;
          try {
            if (whysperAPI && whysperAPI.takeScreenshot) {
              await whysperAPI.takeScreenshot();
            } else {
              addMessage('Screen capture is unavailable in this build.', 'error');
            }
          } catch (error) {
            addMessage('Could not capture the screen. Check screen-capture permissions.', 'error');
          } finally {
            screenCaptureBtn.disabled = false;
          }
        });
      }

      // Screen mode sends live screen frames to the AI. It does not create or save a video file.
      let liveScreenStream = null;
      let liveScreenVideo = null;
      let liveScreenTimer = null;
      let liveScreenFrameInFlight = false;

      async function captureAndAskAI(instruction, stream = null) {
        let temporaryStream = null;
        try {
          const activeStream = stream || (temporaryStream = await navigator.mediaDevices.getDisplayMedia({
            video: { frameRate: { ideal: 5, max: 10 } }, audio: false
          }));
          const video = document.createElement('video');
          video.muted = true;
          video.playsInline = true;
          video.srcObject = activeStream;
          await new Promise((resolve, reject) => {
            if (video.readyState >= 2 && video.videoWidth) return resolve();
            video.onloadedmetadata = () => video.play().then(resolve).catch(reject);
            video.onerror = () => reject(new Error('The selected screen could not be read.'));
            setTimeout(() => reject(new Error('Timed out waiting for the screen frame.')), 8000);
          });
          if (video.paused) await video.play();
          const canvas = document.createElement('canvas');
          canvas.width = Math.min(video.videoWidth || 1280, 1600);
          canvas.height = Math.max(1, Math.round(canvas.width * (video.videoHeight || 720) / (video.videoWidth || 1280)));
          const context = canvas.getContext('2d');
          if (!context) throw new Error('Could not initialize screen image capture.');
          context.drawImage(video, 0, 0, canvas.width, canvas.height);
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.78));
          if (!blob || !blob.size) throw new Error('The selected screen produced an empty frame.');
          const bytes = new Uint8Array(await blob.arrayBuffer());
          if (!whysperAPI || !whysperAPI.analyzeScreenFrame) throw new Error('Screen-to-AI is unavailable in this app build.');
          return await whysperAPI.analyzeScreenFrame(bytes, 'image/jpeg', instruction || '');
        } finally {
          if (temporaryStream) temporaryStream.getTracks().forEach(track => track.stop());
        }
      }

      async function askAIAboutScreen() {
        if (!navigator.mediaDevices?.getDisplayMedia) throw new Error('Screen capture is not supported by this build.');
        addMessage('Choose a screen or window. OpenCluely will send one current frame to the AI.', 'system');
        const result = await captureAndAskAI('Analyze this current screen and answer any visible question. Explain the relevant content clearly.');
        if (result && result.response) renderAssistantResponse(result.response);
        else throw new Error('The AI returned no screen analysis.');
      }

      async function startLiveScreenMode() {
        if (!navigator.mediaDevices?.getDisplayMedia) throw new Error('Live screen capture is not supported by this build.');
        liveScreenStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 5, max: 10 } }, audio: false
        });
        liveScreenVideo = document.createElement('video');
        liveScreenVideo.muted = true;
        liveScreenVideo.playsInline = true;
        liveScreenVideo.srcObject = liveScreenStream;
        await new Promise((resolve, reject) => {
          liveScreenVideo.onloadedmetadata = () => liveScreenVideo.play().then(resolve).catch(reject);
          liveScreenVideo.onerror = () => reject(new Error('Could not start the live screen preview.'));
          setTimeout(() => reject(new Error('Timed out opening the selected screen.')), 8000);
        });
        const stopOnEnd = () => stopLiveScreenMode();
        liveScreenStream.getVideoTracks()[0]?.addEventListener('ended', stopOnEnd, { once: true });
        if (screenRecordBtn) {
          screenRecordBtn.title = 'Stop live screen AI';
          screenRecordBtn.innerHTML = '<i class="fas fa-stop"></i>';
          screenRecordBtn.classList.add('recording');
        }
        addMessage('Live screen AI is on. OpenCluely is sending fresh screen frames for analysis; no video file is being saved. Click Stop to end.', 'system');
        const sendFrame = async () => {
          if (!liveScreenStream || liveScreenFrameInFlight || !liveScreenVideo || !liveScreenVideo.videoWidth) return;
          liveScreenFrameInFlight = true;
          try {
            const canvas = document.createElement('canvas');
            canvas.width = Math.min(liveScreenVideo.videoWidth, 1280);
            canvas.height = Math.max(1, Math.round(canvas.width * liveScreenVideo.videoHeight / liveScreenVideo.videoWidth));
            canvas.getContext('2d').drawImage(liveScreenVideo, 0, 0, canvas.width, canvas.height);
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.68));
            if (!blob || !liveScreenStream) return;
            const bytes = new Uint8Array(await blob.arrayBuffer());
            const result = await whysperAPI.analyzeScreenFrame(bytes, 'image/jpeg',
              'This is a live screen update. Identify important visible changes, read relevant on-screen text, and answer any question or task visible. Be concise and do not repeat generic descriptions.');
            if (result?.response && liveScreenStream) renderAssistantResponse(result.response);
          } catch (error) {
            addMessage('Live screen AI error: ' + (error.message || String(error)), 'error');
            stopLiveScreenMode();
          } finally {
            liveScreenFrameInFlight = false;
          }
        };
        await sendFrame();
        liveScreenTimer = setInterval(sendFrame, 3000);
      }

      function stopLiveScreenMode() {
        if (liveScreenTimer) clearInterval(liveScreenTimer);
        liveScreenTimer = null;
        if (liveScreenStream) liveScreenStream.getTracks().forEach(track => track.stop());
        liveScreenStream = null;
        if (liveScreenVideo) {
          liveScreenVideo.pause();
          liveScreenVideo.srcObject = null;
        }
        liveScreenVideo = null;
        liveScreenFrameInFlight = false;
        if (screenRecordBtn) {
          screenRecordBtn.title = 'Start live screen AI (analyze screen continuously)';
          screenRecordBtn.innerHTML = '<i class="fas fa-eye"></i>';
          screenRecordBtn.classList.remove('recording');
        }
      }

      if (screenCaptureBtn) {
        screenCaptureBtn.title = 'Capture screen and ask AI';
        screenCaptureBtn.addEventListener('click', async () => {
          screenCaptureBtn.disabled = true;
          try {
            await askAIAboutScreen();
          } catch (error) {
            addMessage('Capture screen and ask AI failed: ' + (error.message || String(error)), 'error');
          } finally {
            screenCaptureBtn.disabled = false;
          }
        });
      }

      if (screenRecordBtn) {
        screenRecordBtn.title = 'Start live screen AI (analyze screen continuously)';
        screenRecordBtn.addEventListener('click', async () => {
          if (liveScreenStream) {
            stopLiveScreenMode();
            addMessage('Live screen AI stopped.', 'system');
            return;
          }
          screenRecordBtn.disabled = true;
          try {
            await startLiveScreenMode();
          } catch (error) {
            stopLiveScreenMode();
            addMessage('Could not start live screen AI: ' + (error.message || String(error)), 'error');
          } finally {
            if (screenRecordBtn) screenRecordBtn.disabled = false;
          }
        });
      }

      if (systemAudioListenBtn) {
        systemAudioListenBtn.addEventListener('click', async () => {
          if (!isInteractive) {
            addMessage('Window is in non-interactive mode. Press Alt+A to enable interaction.', 'error');
            return;
          }
          if (customAudioRecorder) {
            stopBuiltInAudioCapture();
            return;
          }
          systemAudioListenBtn.disabled = true;
          let displayStream = null;
          try {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
              throw new Error('Screen/window audio capture is not supported in this build.');
            }
            displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            if (!displayStream.getAudioTracks().length) {
              throw new Error('The selected source provided no system-audio track. On Windows, choose a screen/window and allow system audio when prompted.');
            }
            // The display picker requires video, but only audio is sent to Gemini.
            const audioOnlyStream = new MediaStream(displayStream.getAudioTracks());
            const fullDisplayStream = displayStream;
            displayStream.getVideoTracks().forEach(track => track.addEventListener('ended', () => {
              if (customAudioRecorder) stopBuiltInAudioCapture();
            }, { once: true }));
            await startBuiltInAudioCapture(audioOnlyStream, 'selected screen/window audio', fullDisplayStream);
            systemAudioListenBtn.title = 'Stop listening to screen audio';
            systemAudioListenBtn.innerHTML = '<i class="fas fa-stop"></i>';
            systemAudioListenBtn.classList.add('recording');
            displayStream = null;
          } catch (error) {
            if (displayStream) displayStream.getTracks().forEach(track => track.stop());
            addMessage('Could not start screen-audio capture: ' + (error.message || String(error)), 'error');
          } finally {
            systemAudioListenBtn.disabled = false;
          }
        });
      }

      // Explicit pointer-drag fallback: native app-region dragging can be
      // unreliable for transparent frameless windows on some Windows builds.
      // Ignore buttons so recording/overlay/clear controls stay clickable.
      if (chatHeader && whysperAPI && whysperAPI.moveChatWindow) {
        let dragPointer = null;
        chatHeader.addEventListener('pointerdown', event => {
          if (event.button !== 0 || event.target.closest('button, input, textarea, a, select')) return;
          dragPointer = { id: event.pointerId, x: event.screenX, y: event.screenY };
          try { chatHeader.setPointerCapture(event.pointerId); } catch (_) {}
          event.preventDefault();
        });
        chatHeader.addEventListener('pointermove', event => {
          if (!dragPointer || event.pointerId !== dragPointer.id) return;
          const deltaX = event.screenX - dragPointer.x;
          const deltaY = event.screenY - dragPointer.y;
          if (!deltaX && !deltaY) return;
          dragPointer.x = event.screenX;
          dragPointer.y = event.screenY;
          whysperAPI.moveChatWindow(deltaX, deltaY);
        });
        const finishDrag = event => {
          if (dragPointer && event.pointerId === dragPointer.id) {
            try { chatHeader.releasePointerCapture(event.pointerId); } catch (_) {}
            dragPointer = null;
          }
        };
        chatHeader.addEventListener('pointerup', finishDrag);
        chatHeader.addEventListener('pointercancel', finishDrag);
      }

      // Turning the overlay off hides its windows, including this chat. The
      // existing Ctrl+Shift+V shortcut and main toolbar remain available to
      // bring the overlay back.
      if (overlayToggleBtn) {
        overlayToggleBtn.addEventListener('click', async () => {
          try {
            if (whysperAPI && whysperAPI.toggleOverlay) {
              const result = await whysperAPI.toggleOverlay();
              const enabled = !!(result && result.enabled);
              overlayToggleBtn.title = enabled ? 'Turn overlay off' : 'Turn overlay on';
              overlayToggleBtn.setAttribute('aria-label', overlayToggleBtn.title);
              overlayToggleBtn.innerHTML = enabled
                ? '<i class="fas fa-eye-slash"></i>'
                : '<i class="fas fa-eye"></i>';
              overlayToggleBtn.classList.toggle('overlay-disabled', !enabled);
            }
          } catch (error) {
            addMessage('Could not change overlay visibility.', 'error');
          }
        });
      }

      if (micButton) {
        micButton.addEventListener('click', async () => {
          if (!isInteractive) {
            addMessage('Window is in non-interactive mode. Press Alt+A to enable interaction.', 'error');
            return;
          }
          if (customAudioRecorder) {
            stopBuiltInAudioCapture();
            return;
          }
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
              video: false
            });
            await startBuiltInAudioCapture(stream, 'microphone audio');
          } catch (error) {
            if (customAudioStream) customAudioStream.getTracks().forEach(track => track.stop());
            customAudioStream = null;
            customAudioRecorder = null;
            addMessage('Could not start microphone capture: ' + (error.message || String(error)), 'error');
          }
        });
      }

      if (sendButton) {
        sendButton.addEventListener('click', async () => {
          const text = messageInput.value.trim();
          if (text) {
            addMessage(text, 'user');
            messageInput.value = '';
            
            // Show thinking indicator after user message
            setTimeout(() => {
              showThinkingIndicator();
            }, 300);
            
            // Send to main process for session memory storage and LLM processing
            try {
              if (whysperAPI && whysperAPI.sendChatMessage) {
                await whysperAPI.sendChatMessage(text);
              }
            } catch (error) {
              console.error('Failed to send chat message to main process:', error);
            }
          }
        });
      }

      // Auto-resize for multiline textarea
      function autoGrow(el) {
        if (!el) return;
        el.style.height = 'auto';
        const max = 140; // keep within container limits
        el.style.height = Math.min(el.scrollHeight, max) + 'px';
      }
      if (messageInput) {
        autoGrow(messageInput);
        messageInput.addEventListener('input', () => autoGrow(messageInput));
      }

      // Replace keypress with keydown to support Shift+Enter for newline and Enter to send
      if (messageInput) {
        messageInput.addEventListener('keydown', async (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (text) {
              addMessage(text, 'user');
              messageInput.value = '';
              autoGrow(messageInput);
              setTimeout(() => { showThinkingIndicator(); }, 300);
              try {
                if (whysperAPI && whysperAPI.sendChatMessage) {
                  await whysperAPI.sendChatMessage(text);
                }
              } catch (error) {
                console.error('Failed to send chat message to main process:', error);
              }
            }
          }
          // If Shift+Enter, allow default to insert newline
        });
      }

      // Global keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.altKey && e.key === 'r') {
          e.preventDefault();
          if (!isInteractive) return;
          micButton && micButton.click();
        }
      });

      // Initialize
      if (!chatHistory || chatHistory.length === 0) {
        addMessage('Recording in Progress. press Alt+R to stop recording.', 'system');
      }
    </script>
  </body>
</html>
